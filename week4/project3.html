<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tech Club Registration</h1>

    <h2>Upcoming Tech Club Events</h2>

<table border="1">
    <thead>
        <tr>
            <th>Event Name</th>
            <th>Date</th>
            <th>Venue</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Web Development Workshop</td>
            <td>10 November 2026</td>
            <td>Computer Lab</td>
        </tr>

        <tr>
            <td>Coding Competition</td>
            <td>15 November 2026</td>
            <td>Seminar Hall</td>
        </tr>

        <tr>
            <td>AI Workshop</td>
            <td>20 November 2026</td>
            <td>Auditorium</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="3">Total Events: 3</td>
        </tr>
    </tfoot>
</table>
<br><br>

<form>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
    <br><br>

    <label for="date">Date:</label>
<input type="date" id="date" name="date">
<br><br>

<label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone">
<br><br>

<p>Choose Your Year:</p>
<input type="radio" id="first" name="year" value="First Year">
<label for="first">First Year</label>

<input type="radio" id="second" name="year" value="Second Year">
<label for="second">Second Year</label>
<br><br>

<p>Select Your Interests:</p>
<input type="checkbox" id="coding" name="interest" value="Coding">
<label for="coding">Coding</label>

<input type="checkbox" id="web" name="interest" value="Web Development">
<label for="web">Web Development</label>
<br><br>

<label for="event">Choose Event:</label>
<select id="event" name="event">
    <option>Web Development Workshop</option>
    <option>Coding Competition</option>
    <option>AI Workshop</option>
</select>
<br><br>

<label for="message">Message:</label>
<br>
<textarea id="message" name="message" rows="4" cols="30"></textarea>
<br><br>

    <button type="submit">Register</button>
</form>

</body>
</html>
